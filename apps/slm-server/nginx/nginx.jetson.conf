# apps/slm-server/nginx/nginx.conf
#
# Reverse proxy in front of the FastAPI SLM Server (slm-server:8000).
# Two things this MUST get right, both of which the default Nginx config
# gets wrong for this workload:
#
#   1. /v1/chat/stream is Server-Sent Events (text/event-stream).
#      Nginx buffers proxied responses by default — it will silently hold
#      the entire SSE stream until the upstream closes the connection
#      before sending anything to the client, defeating streaming entirely.
#      proxy_buffering off fixes this.
#   2. Connection/request-count handling for 10k+ held-open SSE/queue
#      connections needs real worker_connections and file-descriptor
#      headroom.

user  nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    types_hash_max_size 2048;

    log_format main '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Don't leak the Nginx version in error pages / Server header.
    server_tokens off;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # ─────────────────────────────────────────────────────────────
    # FIRST-LINE, COARSE rate/connection limiting.
    # Absorbs network-level abuse BEFORE it reaches the app.
    # ─────────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=ssense_req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=ssense_conn:10m;

    # Per-API-key zone (falls back to IP when the header is absent, e.g. for
    # the plain HTTP->HTTPS redirect and health checks). This is coarse,
    # network-level abuse protection layered IN FRONT OF the app's own
    # per-key sliding-window limiter in security.py/memory_orchestrator.py
    # (which is Redis-backed when SSENSE_REDIS_URL is set) — two independent
    # layers, same intent, deliberately redundant so a bug in one doesn't
    # remove all protection.
    map $http_x_ssense_api_key $ssense_key_zone {
        default $http_x_ssense_api_key;
        ""     $binary_remote_addr;
    }
    limit_req_zone $ssense_key_zone zone=ssense_key_req:10m rate=30r/s;

    # A distinct, MUCH stricter zone just for the heavy audit endpoint,
    # which triggers a full multi-thousand-token LLM generation per call —
    # 20r/s network-level headroom is fine for cheap requests but would let
    # someone queue enough concurrent audits to starve the GPU/CPU worker.
    limit_req_zone $binary_remote_addr zone=ssense_audit:10m rate=2r/s;

    # SOTA FIX: Aligned with docker-compose.yml service name and port
    upstream slm_server {
        server slm-server-jetson:8000;
        keepalive 64;
    }

    # ─────────────────────────────────────────────────────────────
    # HTTP → HTTPS redirect
    # ─────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/ssense.crt;
        ssl_certificate_key /etc/nginx/certs/ssense.key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        limit_req zone=ssense_req burst=40 nodelay;
        limit_req zone=ssense_key_req burst=60 nodelay;
        limit_conn ssense_conn 200;

        # Baseline hardening headers. HSTS is safe to enable even before a
        # real domain/cert is in place (self-signed here) since it's scoped
        # per-Host; swap the cert paths below once a CA-issued cert for the
        # real domain is in place and this becomes fully trusted.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 120k characters is ~120KB. 1MB limit gives plenty of headroom.
        client_max_body_size 1m; 

        # ── Chatbot SSE Streaming Endpoint ──
        location = /v1/chat/stream {
            proxy_pass http://slm_server;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SOTA FIX: Disable buffering exclusively for the SSE stream
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Margin for slow generations
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Forensic Audit Endpoint (heaviest single call: full multi-thousand-
        # token guided-decoding generation) — its own strict zone on top of
        # the general ones above. ──
        location = /v1/audit {
            limit_req zone=ssense_audit burst=4 nodelay;
            proxy_pass http://slm_server;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            gzip on;
            gzip_types application/json;

            proxy_read_timeout 90s;
        }

        # ── Everything else ──
        location / {
            proxy_pass http://slm_server;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Gzip is highly effective for the massive JSON blocks returned by the Auditor
            gzip on;
            gzip_types application/json;
            
            # Generic fallback timeout
            proxy_read_timeout 90s;
        }

        # Lightweight health check
        location = /health {
            proxy_pass http://slm_server/health;
            access_log off;
        }
    }
}