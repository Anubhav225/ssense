# ═══════════════════════════════════════════════════════════════════════════
# Three hardware profiles, one service pair each, selected via:
#   docker compose --profile gpu    up   (discrete NVIDIA datacenter GPU)
#   docker compose --profile jetson up   (Jetson AGX-class edge device)
#   docker compose --profile cpu    up   (no GPU at all)
#
# All three run the SAME base model + multi-LoRA mechanism - only the
# Dockerfile, SSENSE_COMPUTE_PROFILE, and GPU device passthrough differ.
# Mapping-type settings (volumes/healthcheck/restart) are factored out via
# YAML anchors, since '<<:' merge keys only work correctly for mappings.
# Environment lists are written out per-service explicitly - YAML has no
# safe way to splice one list into another via anchors, so attempting that
# silently produces a nested list instead of flattened entries.
# ═══════════════════════════════════════════════════════════════════════════

x-slm-common: &slm-common
  restart: unless-stopped
  expose:
    - "8000"
  ports:
    - "8000:8000"
  env_file:
    - .env
  volumes:
    # Read-write mount for models so ensure_models_exist() can auto-download and persist
    &slm-common-volumes
    - .:/app:rw
    - ../../ml/models:/app/models:rw
    - ../../libs/contracts/schemas:/app/schemas:ro
    # HuggingFace cache mount prevents redownloading base weights across container restarts.
    # Must match HF_HOME set in each Dockerfile (/app/.cache/huggingface) — mounting to
    # /root/.cache/huggingface here is a dead volume: HF_HOME already redirects the library
    # away from $HOME, and doubly so since the process runs as non-root 'ssense' (home=/app,
    # not /root) via docker-entrypoint.sh.
    - ~/.cache/huggingface:/app/.cache/huggingface
    # BUG FIX + PORTABILITY: the audit-result SQLite cache (audit_store.py,
    # default path /app/data/ssense_audit_cache.db) had NO volume at all - it
    # lived only in the container's writable layer, so every
    # `docker compose down` / `--force-recreate` / image rebuild silently
    # wiped 90 days of cached audits.
    #
    # This is a HOST BIND MOUNT (./data/db on the compose file's own host
    # directory), not a Docker named volume, deliberately: a named volume is
    # stored under Docker's internal /var/lib/docker/volumes/<hash>/_data and
    # can only be moved with `docker volume` commands or a helper container.
    # A bind mount is just a folder on disk — to shift this server to a new
    # instance while keeping the DB "local" and portable:
    #   1. docker compose stop slm-server-<profile>   (flush the WAL cleanly)
    #   2. rsync -a ./data/db/ newhost:/path/to/slm-server/data/db/
    #   3. start the container on the new host — it opens the same file, no
    #      docker volume export/import, no daemon involved.
    # See scripts/migrate_db.sh for a scripted version of this, and
    # scripts/backup_db.sh for a live (non-downtime) WAL-safe backup you can
    # run on a schedule without stopping the server.
    - ./data/db:/app/data:rw
    # OPTIONAL, opt-in: a second, independent mount point for db_sync.py's
    # automatic export/import (see db_sync.py's module docstring). Point
    # the host side at network-backed storage (NFS, an s3fs/rclone FUSE
    # mount, a cloud block volume, or just a folder synced elsewhere by
    # other means) and every instance sharing that same path will:
    # (a) auto-import the shared cache on first boot if its own local DB
    # is empty, and (b) periodically export its own local DB there on a
    # timer. Leave this commented out (and SSENSE_DB_EXPORT_PATH unset
    # below) to disable the whole subsystem — it's a strict no-op without
    # it. Uncomment both to enable:
    # - ./data/db-export:/app/data-export:rw
  healthcheck: &slm-common-healthcheck
    test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
    interval: 10s
    timeout: 5s
    retries: 4
    # Models are persisted on host mount; 180s start period allows 15GB weights to map
    # into RAM/VRAM without keeping developers waiting for hours if a startup error occurs.
    start_period: 180s

x-nginx-common: &nginx-common
  image: nginx:1.27-alpine
  restart: unless-stopped
  ports:
    - "80:80"
    - "443:443"
  volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./nginx/certs:/etc/nginx/certs:ro
  healthcheck:
    test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1/nginx-health" ]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  # ─────────────────────────────────────────────────────────────
  # SHARED: Redis — distributed sliding-window rate limiting.
  # Used by every profile below via SSENSE_REDIS_URL. If this service is
  # removed/unreachable, security.py/memory_orchestrator.py fall back to
  # correct-but-per-process in-memory rate limiting automatically (see
  # redis_limiter.py) — Redis is a hardening upgrade, not a hard dependency.
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: ssense-redis
    restart: unless-stopped
    # No host port published — only reachable from other containers on this
    # compose network. Persist to a named volume so limits/nonces survive
    # container restarts (not just process restarts).
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  # ─────────────────────────────────────────────────────────────
  # PROFILE: gpu — discrete NVIDIA datacenter GPU (DGX-class)
  # ─────────────────────────────────────────────────────────────
  slm-server-gpu:
    <<: *slm-common
    profiles: [ "gpu" ]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: ssense-slm-server-gpu
    # SOTA FIX: Shared memory is absolutely critical for vLLM/PyTorch tensor
    # operations. Default Docker shm_size (64MB) causes vLLM to instantly
    # "Bus error (core dumped)".
    shm_size: '8gb'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SSENSE_MAX_CONCURRENT_INFERENCE=${SSENSE_MAX_CONCURRENT_INFERENCE:-220}
      - SSENSE_MAX_QUEUE_DEPTH=${SSENSE_MAX_QUEUE_DEPTH:-20000}
      - SSENSE_MAX_QUEUE_WAIT_SECONDS=${SSENSE_MAX_QUEUE_WAIT_SECONDS:-20}
      - SSENSE_REDIS_URL=${SSENSE_REDIS_URL:-redis://ssense-redis:6379/0}
      - MODELS_DIR=/app/models
      - SSENSE_COMPUTE_PROFILE=gpu
      - VLLM_TARGET_DEVICE=cuda
      - VLLM_WORKER_MULTIPROCESS_METHOD=spawn
      - RAY_DISABLE_MEMORY_MONITOR=1
      # KV-cache overflow buffer in host RAM (GiB) — see engine.py::_build_gpu_args.
      - SSENSE_VLLM_SWAP_SPACE_GB=${SSENSE_VLLM_SWAP_SPACE_GB:-4}
      # Hard concurrency ceiling passed to vLLM's own scheduler. Keep this
      # equal to SSENSE_MAX_CONCURRENT_INFERENCE above — vLLM won't batch
      # more sequences than this, and the admission queue won't admit more
      # than SSENSE_MAX_CONCURRENT_INFERENCE, so mismatching them either
      # starves the GPU (queue admits fewer than vLLM could run) or defeats
      # the queue's own backpressure (vLLM caps lower than the queue expects).
      - SSENSE_VLLM_MAX_NUM_SEQS=${SSENSE_VLLM_MAX_NUM_SEQS:-256}
      # vLLM 0.27 auto-selects an attention backend (FlashAttention-2/3 via
      # the vllm-openai base image) based on detected GPU generation, and
      # that default is correct for most single-GPU deployments — leave this
      # unset unless you've benchmarked an alternative for your specific
      # card. On Hopper/Blackwell datacenter cards specifically, FlashInfer
      # is worth A/B testing against the default at 10k+-connection scale:
      # its paged-KV decode kernels are typically faster than FlashAttention
      # for the many-short-sequences decode pattern this workload produces
      # (lots of concurrent single-token decode steps, as opposed to a few
      # long prefills) — uncomment below only after confirming both the
      # flashinfer wheel is installed in the image and a benchmark on your
      # actual traffic shape shows a win; it is not a safe blind default.
      # - VLLM_ATTENTION_BACKEND=FLASHINFER
      # Automatic DB export/import/sync (db_sync.py) — no-op unless set.
      # Requires the ./data/db-export mount above to also be uncommented.
      # - SSENSE_DB_EXPORT_PATH=/app/data-export
      # - SSENSE_DB_SYNC_INTERVAL_SECONDS=900
      # - SSENSE_DB_EXPORT_RETAIN=5
      # RAG embedder/reranker device placement (rag_engine.py) — auto-selected
      # by default based on real memory headroom after vLLM's own budget (see
      # AsyncHybridRAG._select_device's docstring); uncomment SSENSE_RAG_DEVICE
      # only to force cpu/cuda regardless of that estimate.
      # - SSENSE_RAG_DEVICE=cuda
      # - SSENSE_RAG_MIN_HEADROOM_GB=8.0
      # Caps how many chunk-level audit generations can be in flight across
      # ALL audit requests at once (main.py::_get_audit_chunk_semaphore) —
      # keeps a burst of long-policy audits from crowding out chat's share
      # of vLLM's max_num_seqs batch slots. Default 32 on GPU/jetson, 8 on
      # cpu (see main.py). Also: how many sections one audit will evaluate
      # before falling back to keyword-density prioritization (main.py::
      # _audit_max_chunks_for_profile) — default 20 GPU / 6 CPU.
      # - SSENSE_AUDIT_MAX_CONCURRENT_CHUNKS=32
      # - SSENSE_AUDIT_MAX_CHUNKS_GPU=20
    deploy:
      # Modern Docker GPU Passthrough (replaces deprecated 'runtime: nvidia')
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  nginx-gpu:
    <<: *nginx-common
    profiles: [ "gpu" ]
    container_name: ssense-nginx-proxy-gpu
    volumes:
      - ./nginx/nginx.gpu.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      slm-server-gpu:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # PROFILE: jetson — NVIDIA Jetson AGX-class edge device (Orin / Spark)
  # ─────────────────────────────────────────────────────────────
  slm-server-jetson:
    <<: *slm-common
    profiles: [ "jetson" ]
    build:
      context: .
      dockerfile: Dockerfile.jetson
    container_name: ssense-slm-server-jetson
    shm_size: '4gb'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SSENSE_MAX_CONCURRENT_INFERENCE=${SSENSE_MAX_CONCURRENT_INFERENCE:-14}
      - SSENSE_MAX_QUEUE_DEPTH=${SSENSE_MAX_QUEUE_DEPTH:-500}
      - SSENSE_MAX_QUEUE_WAIT_SECONDS=${SSENSE_MAX_QUEUE_WAIT_SECONDS:-15}
      - SSENSE_REDIS_URL=${SSENSE_REDIS_URL:-redis://ssense-redis:6379/0}
      - MODELS_DIR=/app/models
      - SSENSE_COMPUTE_PROFILE=jetson
      - VLLM_TARGET_DEVICE=cuda
      - VLLM_WORKER_MULTIPROCESS_METHOD=spawn
      - RAY_DISABLE_MEMORY_MONITOR=1
      # Automatic DB export/import/sync (db_sync.py) — see the gpu profile
      # above for the full explanation. No-op unless set.
      # - SSENSE_DB_EXPORT_PATH=/app/data-export
      # - SSENSE_DB_SYNC_INTERVAL_SECONDS=900
      # - SSENSE_DB_EXPORT_RETAIN=5
      # RAG embedder/reranker device placement — auto-selected based on real
      # unified-memory headroom after vLLM's budget (see
      # AsyncHybridRAG._select_device's docstring). This is exactly the
      # setting that matters most on this profile: a tightly-capped ~32GB
      # Jetson auto-selects CPU, while a large-unified-memory board like an
      # AGX Spark-class device (much more headroom above vLLM's
      # SSENSE_TARGET_MEMORY_GB budget) auto-selects GPU — same image, same
      # compose file, correct behavior on both without editing anything
      # below unless you want to force one or the other.
      # - SSENSE_RAG_DEVICE=cuda
      # - SSENSE_RAG_MIN_HEADROOM_GB=8.0
      # Audit chunk concurrency bound + coverage cap — see the gpu profile
      # above. Jetson's much smaller max_num_seqs (16, engine.py) means this
      # matters even more here: leave real headroom for chat.
      # - SSENSE_AUDIT_MAX_CONCURRENT_CHUNKS=8
      # - SSENSE_AUDIT_MAX_CHUNKS_GPU=12
    # Jetson exposes its GPU via the NVIDIA Container Runtime configured at
    # the Docker daemon level (nvidia-docker / nvidia-ctk on L4T), not the
    # same device-reservation syntax as a discrete-GPU host. Ensure the host
    # Docker daemon's default-runtime is set to "nvidia" (standard on
    # JetPack), which passes the device through automatically.
    runtime: nvidia

  nginx-jetson:
    <<: *nginx-common
    profiles: [ "jetson" ]
    container_name: ssense-nginx-proxy-jetson
    volumes:
      - ./nginx/nginx.jetson.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      slm-server-jetson:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # PROFILE: cpu — no GPU at all
  # ─────────────────────────────────────────────────────────────
  slm-server-cpu:
    <<: *slm-common
    profiles: [ "cpu" ]
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: ssense-slm-server-cpu
    shm_size: '8gb'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
      - SSENSE_MAX_CONCURRENT_INFERENCE=${SSENSE_MAX_CONCURRENT_INFERENCE:-7}
      - SSENSE_MAX_QUEUE_DEPTH=${SSENSE_MAX_QUEUE_DEPTH:-300}
      - SSENSE_MAX_QUEUE_WAIT_SECONDS=${SSENSE_MAX_QUEUE_WAIT_SECONDS:-15}
      - SSENSE_REDIS_URL=${SSENSE_REDIS_URL:-redis://ssense-redis:6379/0}
      - MODELS_DIR=/app/models
      - SSENSE_COMPUTE_PROFILE=cpu
      - VLLM_TARGET_DEVICE=cpu
      - OMP_NUM_THREADS=${SSENSE_CPU_THREADS:-}
      - VLLM_CPU_KVCACHE_SPACE=${VLLM_CPU_KVCACHE_SPACE:-2}
      - SSENSE_TARGET_MEMORY_GB=${SSENSE_TARGET_MEMORY_GB:-32.0}
      - VLLM_USE_V1=0
      # Automatic DB export/import/sync (db_sync.py) — see the gpu profile
      # above for the full explanation. No-op unless set.
      # - SSENSE_DB_EXPORT_PATH=/app/data-export
      # - SSENSE_DB_SYNC_INTERVAL_SECONDS=900
      # - SSENSE_DB_EXPORT_RETAIN=5

  nginx-cpu:
    <<: *nginx-common
    profiles: [ "cpu" ]
    container_name: ssense-nginx-proxy-cpu
    volumes:
      - ./nginx/nginx.cpu.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
  # ─────────────────────────────────────────────────────────────
  # OPTIONAL TUNNEL: Cloudflare Tunnel for Global Access
  # Enables the server running on AGX Spark in your lab to be
  # accessed securely from any laptop anywhere in the world
  # without needing a public static IP, router port forwarding,
  # or purchasing a custom domain.
  #
  # Quick mode (free, no account needed):
  #   docker compose --profile tunnel up
  # Named mode (free Cloudflare Zero Trust account):
  #   Set CLOUDFLARE_TUNNEL_TOKEN in your .env file
  # ─────────────────────────────────────────────────────────────
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [ "tunnel", "jetson-tunnel", "gpu-tunnel", "cpu-tunnel" ]
    container_name: ssense-cloudflared-tunnel
    network_mode: host
    command: tunnel --no-autoupdate --url http://127.0.0.1:8000

volumes:
  # Redis is a rate-limit/nonce cache only (see redis_limiter.py) — safe to
  # lose, so it stays a normal named volume. The SQLite audit cache is the
  # data that actually needs to be portable/backed-up, so it's a bind mount
  # (./data/db, declared above) instead of a named volume here.
  redis-data:
